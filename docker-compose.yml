name: sitako-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sitako-web:latest
    container_name: sitako-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sitako-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  sitako-network:
    name: sitako-network
    driver: bridge
