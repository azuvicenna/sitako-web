apiVersion: apps/v1
kind: Deployment
metadata:
  name: sitako-web
  namespace: sitako
  labels:
    app: sitako-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sitako-web
  template:
    metadata:
      labels:
        app: sitako-web
    spec:
      containers:
        - name: frontend
          image: sitako-web:latest
          imagePullPolicy: IfNotPresent # Cocok untuk image lokal yang di-load ke k3s via 'k3s ctr images import'
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sitako-web
  namespace: sitako
  labels:
    app: sitako-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: sitako-web
